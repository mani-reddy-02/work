<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Lightweight SVG Favicon (replaces 624 KB PNG) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#2563eb" />

    <title>MediQuee - Healthcare at Your Doorstep</title>
    <meta name="description" content="Book hospital outpatient appointments, video consultations with verified doctors, home nursing, and lab tests on MediQuee." />

    <!-- Non-Blocking Google Fonts Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-[#F5F8FD] antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F5F8FD; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <img src="/logo.png" alt="MediQuee" style="height: 48px; width: auto; object-fit: contain; animation: mq-pulse 1.6s ease-in-out infinite;" />
          <div style="width: 36px; height: 36px; border: 3px solid #E2E8F0; border-top-color: #1769E0; border-radius: 50%; animation: mq-spin 0.75s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes mq-spin { to { transform: rotate(360deg); } }
        @keyframes mq-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.88; transform: scale(0.98); } }
      </style>
    </div>

    <!-- Crawlable Fallback for Non-JS Clients & SEO Bots -->
    <noscript>
      <div style="padding: 2rem; max-width: 800px; margin: 0 auto; font-family: sans-serif; text-align: center;">
        <h1 style="font-size: 1.5rem; font-weight: bold; color: #1e293b;">MediQuee Healthcare</h1>
        <p style="font-size: 0.875rem; color: #64748b; margin-bottom: 1.5rem;">Hospital Appointments, Video Consultations, Home Nursing &amp; Lab Tests</p>
        <h2 style="font-size: 1.1rem; color: #334155;">Healthcare Services</h2>
        <ul style="list-style: none; padding: 0; line-height: 2;">
          <li><a href="/specialties?type=hospital-op" style="color: #1769E0;">Hospital Outpatient (OP) Booking</a></li>
          <li><a href="/specialties?type=doctor" style="color: #1769E0;">Doctor Video Consultations</a></li>
          <li><a href="/departments" style="color: #1769E0;">Clinical Departments &amp; Specialists</a></li>
          <li><a href="/services/lab-tests" style="color: #1769E0;">Diagnostic Lab Tests &amp; Packages</a></li>
          <li><a href="/services/home-nursing" style="color: #1769E0;">Home Nursing &amp; Attendant Care</a></li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
